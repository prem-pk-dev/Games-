<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10111b"><title>Stack Tower — Games</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d20;color:#fff;font-family:system-ui,sans-serif;touch-action:manipulation}canvas{display:block;width:100%;height:100%;touch-action:manipulation}.hud{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}.pill{padding:9px 16px;border:1px solid #ffffff25;border-radius:13px;background:#101a35cc;backdrop-filter:blur(8px);font-weight:750;font-size:13px}.pill span{color:#6de5f3;margin-left:6px}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#050817b9;padding:20px}.panel{max-width:340px;width:100%;padding:28px;border-radius:22px;border:1px solid #ffffff28;background:linear-gradient(145deg,#1c2a4e,#10172d);text-align:center;box-shadow:0 25px 80px #0009}.panel h1{margin:0 0 10px;font-size:30px;letter-spacing:-1px}.panel p{color:#bdcbe7;line-height:1.6;font-size:14px}.panel button{border:0;border-radius:12px;padding:13px 23px;background:linear-gradient(120deg,#54d7ef,#8b7bff);font-weight:850;color:#071329;font-size:14px;cursor:pointer}.hint{position:fixed;bottom:18px;left:0;right:0;text-align:center;color:#9aabc9;font-size:12px;pointer-events:none}@media(max-width:520px){.pill{padding:8px 12px;font-size:12px}.panel{padding:22px}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">BEST <span id="best">0</span></div><div class="pill">LEVEL <span id="level">1</span></div></div><div class="hint">Tap / click to drop the moving block · Space or Enter</div><div class="overlay" id="overlay"><div class="panel"><h1 id="title">STACK TOWER</h1><p id="copy">Drop each moving block onto the tower. Perfect alignment earns bonus points. Every block that misses the tower ends the run.</p><button id="play">Start stacking</button></div></div>
<script>
(()=>{'use strict';const canvas=document.getElementById('c'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),levelEl=document.getElementById('level'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),copy=document.getElementById('copy'),play=document.getElementById('play');let w=0,h=0,dpr=1,blocks=[],current=null,score=0,best=0,level=1,dir=1,speed=2.2,playing=false,dead=false,falling=[],cameraY=0,phase=0;
try{best=+(localStorage.getItem('games-stack-best')||0)}catch{}bestEl.textContent=best;
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function project(x,y,z=0){const scale=Math.min(w/520,1.35);return{x:w/2+x*scale,y:h*.76-(y-cameraY)*scale*.72+z*scale*.42,s:scale}}
function poly(points,fill,stroke){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}}
function block(b){const p=project(b.x,b.y,b.z),ww=b.width*p.s,dd=54*p.s,hh=24*p.s;const top=[{x:p.x-ww/2,y:p.y-dd/2},{x:p.x,y:p.y-dd/2-hh},{x:p.x+ww/2,y:p.y-dd/2},{x:p.x,y:p.y+hh-dd/2}],left=[top[0],top[3],{x:top[3].x,y:top[3].y+24*p.s},{x:top[0].x,y:top[0].y+24*p.s}],right=[top[3],top[2],{x:top[2].x,y:top[2].y+24*p.s},{x:top[3].x,y:top[3].y+24*p.s}];poly(left,b.side);poly(right,b.front);poly(top,b.top,'#ffffff44')}
function draw(){ctx.clearRect(0,0,w,h);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#101b3d');g.addColorStop(1,'#070b19');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(let i=0;i<80;i++){const x=(i*137)%Math.max(1,w),y=(i*83+phase*.15)%Math.max(1,h);ctx.fillStyle='#b9dfff55';ctx.fillRect(x,y,2,2)}ctx.save();ctx.globalAlpha=.25;for(let i=-4;i<5;i++){ctx.strokeStyle='#70bce8';ctx.beginPath();ctx.moveTo(w/2+i*55,h*.3);ctx.lineTo(w/2+i*145,h);ctx.stroke()}ctx.restore();blocks.forEach(block);falling.forEach(block);if(current)block(current);ctx.fillStyle='#d6e9ff';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText('BUILD YOUR TOWER',w/2,h*.91)}
function sync(){scoreEl.textContent=score;bestEl.textContent=best;levelEl.textContent=level}
function reset(){blocks=[];falling=[];score=0;level=1;speed=2.2;dir=1;cameraY=0;blocks.push({x:0,y:0,z:0,width:180,top:'#3c76bf',front:'#24518e',side:'#193d70'});spawn();sync();playing=true;overlay.style.display='none'}
function spawn(){const hue=(score*29+185)%360;current={x:-170*dir,y:blocks.length*25,z:0,width:blocks.at(-1).width,top:'hsl('+hue+' 85% 68%)',front:'hsl('+hue+' 68% 48%)',side:'hsl('+hue+' 62% 34%)'}}
function end(){playing=false;dead=true;title.textContent='Tower toppled!';copy.textContent='You stacked '+score+' blocks. Best score: '+best+'. Try again and beat your record.';play.textContent='Play again';overlay.style.display='grid'}
function drop(){if(!playing||!current)return;const prev=blocks.at(-1),delta=current.x-prev.x,overlap=prev.width-Math.abs(delta);if(overlap<=3){end();return}const cut=prev.width-overlap;if(Math.abs(delta)<7){current.x=prev.x;current.width=prev.width;score+=2}else{current.width=overlap;current.x=(current.x+prev.x)/2;score++;if(delta>0)falling.push({...current,x:current.x+overlap/2+cut/2,width:cut,y:current.y,z:0});else falling.push({...current,x:current.x-overlap/2-cut/2,width:cut,y:current.y,z:0})}blocks.push(current);if(score>best){best=score;try{localStorage.setItem('games-stack-best',best)}catch{}}level=1+Math.floor(score/8);speed=Math.min(6,2.2+score*.075);cameraY=Math.max(0,(blocks.length-7)*25);sync();if(score>=40){playing=false;title.textContent='Tower champion!';copy.textContent='You reached 40 blocks. Your tower is a masterpiece.';play.textContent='Play another round';overlay.style.display='grid';return}spawn()}
function tick(){phase++;if(playing&&current){current.x+=speed*dir;if(current.x>170){current.x=170;dir=-1}if(current.x< -170){current.x=-170;dir=1}}falling.forEach(b=>{b.y-=4;b.z+=2});falling=falling.filter(b=>b.y>-30);draw();requestAnimationFrame(tick)}
canvas.addEventListener('pointerdown',drop);play.addEventListener('click',reset);window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();drop()}if(e.key.toLowerCase()==='r')reset()});window.addEventListener('resize',resize);resize();sync();tick()})();
</script></body></html>
