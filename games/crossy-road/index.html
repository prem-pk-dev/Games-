<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10111b"><title>Crossy Road — Games</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:12px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}.pill{background:#101827d9;border:1px solid #ffffff25;border-radius:12px;padding:8px 15px;font-weight:800;font-size:13px}.pill span{color:#ffe07a;margin-left:6px}.controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:center;gap:10px}.controls button{width:54px;height:48px;border:1px solid #ffffff55;border-radius:14px;background:#101827cc;color:#fff;font-size:21px;font-weight:900;touch-action:none}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#07101dbb;padding:20px}.panel{max-width:340px;width:100%;padding:28px;border-radius:22px;background:linear-gradient(145deg,#214b4a,#15283b);border:1px solid #ffffff30;text-align:center;box-shadow:0 25px 80px #0008}.panel h1{font-size:29px;margin:0 0 10px}.panel p{font-size:14px;line-height:1.6;color:#d0e6df}.panel button{border:0;border-radius:12px;padding:13px 23px;background:#ffdb70;color:#273344;font-weight:900;font-size:14px}.hint{position:fixed;bottom:78px;left:0;right:0;text-align:center;color:#e5f1e8;font-size:11px;text-shadow:0 2px 4px #000;pointer-events:none}@media(min-width:700px){.controls{opacity:.35}.controls:hover{opacity:1}}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">STEPS <span id="score">0</span></div><div class="pill">BEST <span id="best">0</span></div></div><div class="hint">Arrow keys / WASD · Swipe or use buttons</div><div class="controls"><button data-move="left">←</button><button data-move="back">↑</button><button data-move="forward">↓</button><button data-move="right">→</button></div><div class="overlay" id="overlay"><div class="panel"><h1 id="title">CROSSY ROAD</h1><p id="copy">Hop across busy roads and grassy lanes. Avoid cars, trucks and water. How far can you travel?</p><button id="play">Start crossing</button></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),copy=document.getElementById('copy'),play=document.getElementById('play');let w,h,dpr,score=0,best=0,player={x:0,z:0},lanes=[],cars=[],playing=false,dead=false,cam=0,frame=0,moveLock=false;
try{best=+(localStorage.getItem('games-crossy-best')||0)}catch{}bestEl.textContent=best;
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function laneAt(z){return lanes.find(l=>l.z===z)}
function addLane(z){const type=z%5===0?'grass':(z%2===0?'road':'grass'),lane={z,type,dir:Math.random()<.5?-1:1,speed:1.4+Math.random()*1.7,cars:[]};if(type==='road'){for(let i=0;i<3;i++)lane.cars.push({x:i*220+Math.random()*80-100,width:65+Math.random()*30,color:['#ff6d67','#55b8e8','#ffd166','#a58bff'][Math.floor(Math.random()*4)]})}lanes.push(lane)}
function project(x,z){const depth=z-cam,scale=Math.max(.38,1-depth*.022),tile=Math.min(w*.12,72)*scale;return{x:w/2+x*tile*.88,y:h*.68-depth*tile*.53,tw:tile,th:tile*.58,scale}}
function diamond(x,y,tw,th,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(x,y-th);ctx.lineTo(x+tw/2,y);ctx.lineTo(x,y+th);ctx.lineTo(x-tw/2,y);ctx.closePath();ctx.fill()}
function draw(){if(!w||!h)return;ctx.clearRect(0,0,w,h);const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#8ed7e8');sky.addColorStop(.55,'#d3e8c6');sky.addColorStop(1,'#557b68');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(const lane of lanes){const p=project(0,lane.z);if(p.y<-100||p.y>h+100)continue;const width=p.tw*9;diamond(w/2,p.y,width,p.th,lane.type==='road'?'#46515b':(lane.z%4===0?'#5d9b61':'#72b96b'));if(lane.type==='road'){ctx.strokeStyle='#f5d87a';ctx.lineWidth=Math.max(1,3*p.scale);ctx.setLineDash([15*p.scale,13*p.scale]);ctx.beginPath();ctx.moveTo(w/2-width/2,p.y);ctx.lineTo(w/2+width/2,p.y);ctx.stroke();ctx.setLineDash([]);for(const car of lane.cars){const cp=project(car.x/100,lane.z);const cw=car.width*p.scale,ch=23*p.scale;ctx.fillStyle='#1c2937';ctx.fillRect(cp.x-cw/2,cp.y-ch/2+4*p.scale,cw,ch);ctx.fillStyle=car.color;ctx.beginPath();ctx.roundRect(cp.x-cw/2,cp.y-ch/2,cw,ch,6*p.scale);ctx.fill();ctx.fillStyle='#d9f4ff';ctx.fillRect(cp.x-cw*.28,cp.y-ch*.36,cw*.22,ch*.28);ctx.fillRect(cp.x+cw*.06,cp.y-ch*.36,cw*.22,ch*.28);ctx.fillStyle='#18202a';ctx.fillRect(cp.x-cw*.34,cp.y+ch*.34,cw*.2,5*p.scale);ctx.fillRect(cp.x+cw*.14,cp.y+ch*.34,cw*.2,5*p.scale)}}else{for(let i=-4;i<=4;i++){const tree=project(i,lane.z);if((i+lane.z)%3===0){ctx.fillStyle='#694d35';ctx.fillRect(tree.x-4*p.scale,tree.y-26*p.scale,8*p.scale,28*p.scale);ctx.fillStyle='#2f794d';ctx.beginPath();ctx.arc(tree.x,tree.y-32*p.scale,14*p.scale,0,Math.PI*2);ctx.fill()}}}}
const pp=project(player.x,player.z);ctx.fillStyle='#27313b';ctx.beginPath();ctx.ellipse(pp.x,pp.y+10*pp.scale,15*pp.scale,7*pp.scale,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff1d1';ctx.beginPath();ctx.arc(pp.x,pp.y-12*pp.scale,12*pp.scale,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f5a84e';ctx.fillRect(pp.x-10*pp.scale,pp.y-3*pp.scale,20*pp.scale,17*pp.scale);ctx.fillStyle='#1b2730';ctx.fillRect(pp.x-5*pp.scale,pp.y-15*pp.scale,3*pp.scale,3*pp.scale);ctx.fillRect(pp.x+3*pp.scale,pp.y-15*pp.scale,3*pp.scale,3*pp.scale)}
function sync(){scoreEl.textContent=score;bestEl.textContent=best}
function reset(){score=0;player={x:0,z:0};cam=0;lanes=[];for(let z=-4;z<28;z++)addLane(z);playing=true;dead=false;sync();overlay.style.display='none'}
function end(){playing=false;dead=true;title.textContent='Game over!';copy.textContent='You crossed '+score+' lanes. Best distance: '+best+'. Try another run!';play.textContent='Play again';overlay.style.display='grid'}
function move(dir){if(!playing||moveLock)return;moveLock=true;setTimeout(()=>moveLock=false,95);if(dir==='back')player.z=Math.max(0,player.z-1);if(dir==='forward'){player.z++;score=Math.max(score,player.z);if(score>best){best=score;try{localStorage.setItem('games-crossy-best',best)}catch{}}}if(dir==='left')player.x=Math.max(-4,player.x-1);if(dir==='right')player.x=Math.min(4,player.x+1);if(player.z>cam+7)cam=player.z-7;while(lanes.length&&lanes[0].z<cam-5)lanes.shift();const last=lanes.at(-1)?.z??0;while(lanes.length<34)addLane((lanes.at(-1)?.z??last)+1);const lane=laneAt(player.z);if(lane?.type==='road'&&lane.cars.some(car=>Math.abs(car.x/100-player.x)<.68))end();sync();draw()}
function tick(){frame++;if(playing){for(const lane of lanes)if(lane.type==='road'){for(const car of lane.cars){car.x+=lane.dir*lane.speed;if(car.x>600)car.x=-600;if(car.x< -600)car.x=600}if(lane.z===player.z&&lane.cars.some(car=>Math.abs(car.x/100-player.x)<.68))end()}}draw();requestAnimationFrame(tick)}
play.addEventListener('click',reset);document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.move)}));window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();const map={arrowup:'forward',w:'forward',arrowdown:'back',s:'back',arrowleft:'left',a:'left',arrowright:'right',d:'right'};if(map[k]){e.preventDefault();move(map[k])}});let sx=0,sy=0;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<12)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy<0?'forward':'back'))});window.addEventListener('resize',resize);resize();for(let z=-4;z<28;z++)addLane(z);tick()})();
</script></body></html>
