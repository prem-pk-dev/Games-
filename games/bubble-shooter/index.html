<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10111b"><title>Bubble Shooter — Games</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#10111b;color:#f8f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 0,#29234c,#10111b 65%)}.wrap{width:min(100%,760px);text-align:center}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 auto 12px;max-width:620px}.top h1{font-size:clamp(22px,4vw,30px);margin:0;letter-spacing:-1px}.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.stat{background:#202238;border:1px solid #ffffff18;border-radius:11px;padding:7px 12px;font-size:12px;color:#c5c7dd}.stat b{color:#fff;margin-left:5px}.gamebox{position:relative;width:min(100%,620px);margin:auto;border:1px solid #ffffff20;border-radius:20px;padding:10px;background:linear-gradient(145deg,#20223b,#141626);box-shadow:0 25px 80px #0008}.canvas-wrap{position:relative;width:100%;aspect-ratio:620/690;max-height:76vh;overflow:hidden;border-radius:13px;background:linear-gradient(#151b37,#101427)}canvas{display:block;width:100%;height:100%;touch-action:none}.message{position:absolute;inset:0;display:none;place-items:center;background:#090b19c9;padding:20px}.message.show{display:grid}.panel{max-width:310px;padding:22px;border:1px solid #ffffff25;border-radius:18px;background:#20233b}.panel h2{margin:0 0 8px}.panel p{font-size:13px;color:#c1c5dc}.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:11px;padding:10px 16px;background:#8d6bfa;color:#fff;font-weight:750;cursor:pointer}button.secondary{background:#30344f;border:1px solid #ffffff22}button:focus-visible{outline:3px solid #47d9e9;outline-offset:3px}.hint{font-size:12px;color:#9da3c0;margin:10px 0 0}.bottom{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:12px}@media(max-width:480px){body{padding:9px}.gamebox{padding:6px;border-radius:15px}.top{margin-bottom:8px}.stat{padding:6px 8px;font-size:11px}.canvas-wrap{max-height:70vh}}
</style></head>
<body><main class="wrap"><div class="top"><h1>🫧 Bubble Shooter</h1><div class="stats"><div class="stat">Score <b id="score">0</b></div><div class="stat">Level <b id="level">1</b></div><div class="stat">Shots <b id="shots">0</b></div></div></div>
<div class="gamebox"><div class="canvas-wrap"><canvas id="game" width="620" height="690" aria-label="Bubble Shooter game board"></canvas><div class="message show" id="overlay"><div class="panel"><h2 id="over-title">Ready to pop?</h2><p id="over-copy">Aim, shoot and match at least three bubbles of the same colour. Clear the board to advance.</p><div class="actions"><button id="start">Start game</button></div></div></div></div></div>
<div class="bottom"><button class="secondary" id="swap">⇄ Swap bubble</button><button class="secondary" id="restart">↻ Restart</button></div><p class="hint">Aim with mouse or finger · Tap/click to shoot · Clear connected groups of 3+</p></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),W=620,H=690,R=20,COLS=14,STEP=40,TOP=38,colors=['#ff668c','#51c9e8','#ffd166','#9b83ff','#69dfa8','#ff9e56'];
let grid=[],shots=0,score=0,level=1,active=null,next=null,aim={x:310,y:130},moving=null,started=false,ended=false,won=false,anim=0;
const center=(r,c)=>({x:30+c*STEP+(r%2)*20,y:TOP+r*35});
function randomColor(){const used=new Set(grid.flat().filter(Boolean));const avail=colors.filter(c=>used.has(c));return (avail.length?avail:colors)[Math.floor(Math.random()*(avail.length?avail:colors).length)]}
function makeBubble(color,x=310,y=625){return{x,y,color,r:R}}
function initBoard(){grid=[];const rows=Math.min(7+level,10);for(let r=0;r<rows;r++){grid[r]=[];for(let c=0;c<COLS;c++){if(r%2===1&&c===COLS-1){grid[r][c]=null;continue}grid[r][c]=Math.random()<.94?colors[Math.floor(Math.random()*Math.min(colors.length,3+Math.floor((level-1)/2)))]:null}}}
function reset(){score=0;shots=0;level=1;started=true;ended=false;won=false;moving=null;initBoard();active=makeBubble(randomColor());next=makeBubble(randomColor());sync();hideOverlay();draw()}
function sync(){document.getElementById('score').textContent=score;document.getElementById('level').textContent=level;document.getElementById('shots').textContent=shots}
function showOverlay(title,copy,button){document.getElementById('over-title').textContent=title;document.getElementById('over-copy').textContent=copy;document.getElementById('start').textContent=button;document.getElementById('overlay').classList.add('show')}
function hideOverlay(){document.getElementById('overlay').classList.remove('show')}
function neighbors(r,c){const even=r%2===0;return [[r,c-1],[r,c+1],[r-1,c+(even?-1:0)],[r-1,c+(even?0:1)],[r+1,c+(even?-1:0)],[r+1,c+(even?0:1)]].filter(([y,x])=>y>=0&&y<grid.length&&x>=0&&x<COLS&&grid[y][x])}
function nearestSlot(x,y){let best=null,dist=1e9;for(let r=0;r<Math.max(grid.length+3,18);r++)for(let c=0;c<COLS;c++){if(r%2===1&&c===COLS-1)continue;if(grid[r]?.[c])continue;const p=center(r,c),d=Math.hypot(p.x-x,p.y-y);if(d<dist){dist=d;best={r,c,p}}}return best}
function group(r,c){const color=grid[r][c],stack=[[r,c]],seen=new Set([r+','+c]),out=[];while(stack.length){const [y,x]=stack.pop();out.push([y,x]);for(const [ny,nx] of neighbors(y,x)){const k=ny+','+nx;if(!seen.has(k)&&grid[ny][nx]===color){seen.add(k);stack.push([ny,nx])}}}return out}
function dropFloating(){const seen=new Set(),stack=[];for(let c=0;c<COLS;c++)if(grid[0]?.[c]){stack.push([0,c]);seen.add('0,'+c)}while(stack.length){const [r,c]=stack.pop();for(const [y,x] of neighbors(r,c)){const k=y+','+x;if(!seen.has(k)){seen.add(k);stack.push([y,x])}}}let dropped=0;for(let r=0;r<grid.length;r++)for(let c=0;c<COLS;c++)if(grid[r][c]&&!seen.has(r+','+c)){grid[r][c]=null;dropped++}score+=dropped*20}
function settle(x,y){const slot=nearestSlot(x,y);if(!slot){finish(false);return}while(grid.length<=slot.r)grid.push(Array(COLS).fill(null));grid[slot.r][slot.c]=active.color;const matched=group(slot.r,slot.c);if(matched.length>=3){for(const [r,c] of matched)grid[r][c]=null;score+=matched.length*10;dropFloating()}shots++;active=next;active.x=310;active.y=625;next=makeBubble(randomColor());sync();if(grid.every(row=>row.every(v=>!v))){if(level>=3){finish(true);return}level++;initBoard();score+=100*level;sync()}else if(grid.some((row,r)=>row.some(Boolean)&&center(r,0).y>520)){finish(false);return}else if(shots%7===0){grid.unshift(Array(COLS).fill(null).map((_,c)=>c===COLS-1?null:colors[Math.floor(Math.random()*Math.min(colors.length,3+Math.floor((level-1)/2)))]));if(grid.length>15)finish(false)}draw()}
function finish(win){ended=true;won=win;showOverlay(win?'You cleared all 3 levels!':'Board reached the danger line',win?'Amazing popping! Your final score is '+score+'.':'Final score: '+score+'. Try again and plan your shots.',win?'Play again':'Try again');}
function shoot(){if(!started||ended||moving)return;const dx=aim.x-310,dy=aim.y-625,angle=Math.atan2(dy,dx),min=-Math.PI+0.15,max=-0.15;const a=Math.max(min,Math.min(max,angle));moving={x:310,y:625,vx:Math.cos(a)*10,vy:Math.sin(a)*10,color:active.color};}
function update(){if(moving){moving.x+=moving.vx;moving.y+=moving.vy;if(moving.x<R||moving.x>W-R)moving.vx*=-1;let hit=moving.y<TOP-5;for(let r=0;r<grid.length&&!hit;r++)for(let c=0;c<COLS;c++){if(grid[r][c]){const p=center(r,c);if(Math.hypot(p.x-moving.x,p.y-moving.y)<R*2-2){hit=true;break}}}if(hit||moving.y<20){const m=moving;moving=null;settle(m.x,m.y)}}}
function bubble(x,y,color,r=R){const g=ctx.createRadialGradient(x-r*.35,y-r*.4,2,x,y,r*1.2);g.addColorStop(0,'#ffffff');g.addColorStop(.18,color);g.addColorStop(1,'#171a31');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff55';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#ffffff55';ctx.beginPath();ctx.ellipse(x-r*.35,y-r*.45,r*.25,r*.12,-.5,0,Math.PI*2);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#1b2141');bg.addColorStop(1,'#101427');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.strokeStyle='#ffffff12';ctx.setLineDash([5,8]);ctx.beginPath();ctx.moveTo(8,545);ctx.lineTo(W-8,545);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#ff6f8d';ctx.font='12px system-ui';ctx.fillText('DANGER LINE',12,565);for(let r=0;r<grid.length;r++)for(let c=0;c<COLS;c++)if(grid[r][c]){const p=center(r,c);bubble(p.x,p.y,grid[r][c])}ctx.fillStyle='#ffffff30';ctx.beginPath();ctx.arc(310,625,27,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#ffffff55';ctx.stroke();if(active)bubble(310,625,active.color);if(next){ctx.fillStyle='#c5c9df';ctx.font='12px system-ui';ctx.fillText('NEXT',370,630);bubble(425,625,next.color,14)}if(moving)bubble(moving.x,moving.y,moving.color);if(started&&!ended){const dx=aim.x-310,dy=aim.y-625,a=Math.atan2(dy,dx);ctx.strokeStyle='#ffffff70';ctx.setLineDash([6,7]);ctx.beginPath();ctx.moveTo(310,625);ctx.lineTo(310+Math.cos(a)*170,625+Math.sin(a)*170);ctx.stroke();ctx.setLineDash([])}}
function frame(){update();draw();requestAnimationFrame(frame)}
function pointer(e){const rect=canvas.getBoundingClientRect();aim.x=(e.clientX-rect.left)*W/rect.width;aim.y=(e.clientY-rect.top)*H/rect.height;aim.x=Math.max(10,Math.min(W-10,aim.x));aim.y=Math.min(620,aim.y)}
canvas.addEventListener('pointermove',pointer);canvas.addEventListener('pointerdown',e=>{pointer(e);shoot()});document.getElementById('start').addEventListener('click',reset);document.getElementById('restart').addEventListener('click',reset);document.getElementById('swap').addEventListener('click',()=>{if(!started||ended||moving)return;const t=active.color;active.color=next.color;next.color=t;draw()});window.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();shoot()}if(e.key==='r'||e.key==='R')reset()});initBoard();active=makeBubble(colors[0]);next=makeBubble(colors[2]);draw();requestAnimationFrame(frame);
})();
</script></body></html>
