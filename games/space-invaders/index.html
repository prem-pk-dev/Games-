<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070b20"><title>Space Invaders — Games</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b20;color:#fff;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:13px;left:0;right:0;display:flex;justify-content:center;gap:9px;pointer-events:none}.pill{background:#101b37db;border:1px solid #ffffff28;border-radius:12px;padding:8px 13px;font-weight:850;font-size:12px}.pill span{color:#7af2d2;margin-left:5px}.controls{position:fixed;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:12px}.controls button{width:58px;height:46px;border-radius:13px;border:1px solid #ffffff45;background:#18294ddd;color:white;font-size:19px;font-weight:900;touch-action:none}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#05091bd9;padding:20px}.panel{width:min(340px,100%);padding:27px;border-radius:22px;background:linear-gradient(145deg,#1b2850,#11162d);border:1px solid #ffffff2b;text-align:center;box-shadow:0 20px 80px #0009}.panel h1{margin:0 0 10px;font-size:29px}.panel p{font-size:14px;line-height:1.6;color:#c0cbea}.panel button{border:0;border-radius:12px;padding:13px 23px;background:linear-gradient(120deg,#65f0cf,#72a8ff);font-weight:900;color:#071426}.hint{position:fixed;bottom:69px;left:0;right:0;text-align:center;color:#9eacd0;font-size:11px}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">LIVES <span id="lives">3</span></div><div class="pill">WAVE <span id="wave">1</span></div></div><div class="hint">Move: ← → / A D · Fire: Space or tap</div><div class="controls"><button id="left">◀</button><button id="fire">✦</button><button id="right">▶</button></div><div class="overlay" id="overlay"><div class="panel"><h1 id="title">SPACE INVADERS</h1><p id="copy">Defend your ship from waves of alien invaders. Move, shoot and survive as long as you can.</p><button id="play">Launch mission</button></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),waveEl=document.getElementById('wave'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),copy=document.getElementById('copy'),play=document.getElementById('play');let w,h,dpr,ship,aliens,shots,enemyShots,keys={},score=0,lives=3,wave=1,playing=false,frame=0,dir=1,fireCooldown=0,invulnerable=0,touchX=null;
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function makeWave(){aliens=[];const cols=Math.min(9,Math.max(5,Math.floor(w/65)));for(let r=0;r<3+Math.min(2,wave-1);r++)for(let col=0;col<cols;col++)aliens.push({x:45+col*(w-90)/(cols-1),y:100+r*43,r,col,row:r,phase:Math.random()*6})}
function reset(){score=0;lives=3;wave=1;shots=[];enemyShots=[];ship={x:w/2,y:h-115};dir=1;frame=0;invulnerable=100;makeWave();sync();playing=true;overlay.style.display='none'}
function sync(){scoreEl.textContent=score;livesEl.textContent=lives;waveEl.textContent=wave}
function loseLife(){if(invulnerable>0)return;lives--;invulnerable=100;sync();if(lives<=0){playing=false;title.textContent='Mission failed';copy.textContent='Final score: '+score+'. You reached wave '+wave+'. Launch another mission?';play.textContent='Play again';overlay.style.display='grid'}}
function fire(){if(!playing||fireCooldown>0)return;shots.push({x:ship.x,y:ship.y-18});fireCooldown=13}
function draw(){if(!w||!h)return;ctx.clearRect(0,0,w,h);const bg=ctx.createLinearGradient(0,0,0,h);bg.addColorStop(0,'#0b1431');bg.addColorStop(1,'#060914');ctx.fillStyle=bg;ctx.fillRect(0,0,w,h);for(let i=0;i<90;i++){const x=(i*173)%w,y=(i*97+frame*.22)%(h-20);ctx.fillStyle=i%4?'#a9c8ff66':'#6df5d888';ctx.fillRect(x,y,2,2)}ctx.strokeStyle='#4d6ba633';ctx.beginPath();ctx.moveTo(0,h-75);ctx.lineTo(w,h-75);ctx.stroke();aliens?.forEach(a=>{const bob=Math.sin(frame*.08+a.phase)*3,x=a.x,y=a.y+bob;ctx.fillStyle=['#6cf0c4','#f5d66d','#b49cff'][a.row%3];ctx.fillRect(x-13,y-10,26,17);ctx.fillRect(x-19,y-4,6,9);ctx.fillRect(x+13,y-4,6,9);ctx.fillRect(x-9,y+7,5,5);ctx.fillRect(x+5,y+7,5,5);ctx.fillStyle='#10213b';ctx.fillRect(x-7,y-5,4,5);ctx.fillRect(x+4,y-5,4,5)});shots?.forEach(s=>{ctx.fillStyle='#7df8d7';ctx.shadowColor='#7df8d7';ctx.shadowBlur=12;ctx.fillRect(s.x-2,s.y-10,4,14);ctx.shadowBlur=0});enemyShots?.forEach(s=>{ctx.fillStyle='#ff718e';ctx.shadowColor='#ff718e';ctx.shadowBlur=10;ctx.fillRect(s.x-3,s.y-2,6,12);ctx.shadowBlur=0});if(ship){ctx.save();ctx.translate(ship.x,ship.y);ctx.globalAlpha=invulnerable>0&&Math.floor(frame/5)%2===0?.35:1;ctx.fillStyle='#7ccaff';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(19,17);ctx.lineTo(6,12);ctx.lineTo(0,18);ctx.lineTo(-6,12);ctx.lineTo(-19,17);ctx.closePath();ctx.fill();ctx.fillStyle='#b8fff0';ctx.fillRect(-3,7,6,17+Math.sin(frame*.5)*4);ctx.restore()}}
function tick(){frame++;if(playing){if(keys.ArrowLeft||keys.a)ship.x-=5.5;if(keys.ArrowRight||keys.d)ship.x+=5.5;ship.x=Math.max(22,Math.min(w-22,ship.x));if(keys.Space||keys[' '])fire();if(fireCooldown>0)fireCooldown--;if(invulnerable>0)invulnerable--;shots.forEach(s=>s.y-=8);shots=shots.filter(s=>s.y>-10);enemyShots.forEach(s=>s.y+=4+wave*.3);enemyShots=enemyShots.filter(s=>s.y<h+20);if(frame%Math.max(25,90-wave*5)===0&&aliens.length){const a=aliens[Math.floor(Math.random()*aliens.length)];enemyShots.push({x:a.x,y:a.y+12})}if(frame%Math.max(2,7-wave*.35)===0){let edge=false;aliens.forEach(a=>{a.x+=dir*(1.4+wave*.28);if(a.x>w-28||a.x<28)edge=true});if(edge){dir*=-1;aliens.forEach(a=>a.y+=15)}}for(let i=shots.length-1;i>=0;i--){const s=shots[i],j=aliens.findIndex(a=>Math.abs(a.x-s.x)<19&&Math.abs(a.y-s.y)<17);if(j>=0){aliens.splice(j,1);shots.splice(i,1);score+=10;scoreEl.textContent=score}}for(let i=enemyShots.length-1;i>=0;i--){const s=enemyShots[i];if(Math.abs(s.x-ship.x)<19&&Math.abs(s.y-ship.y)<21){enemyShots.splice(i,1);loseLife()}}if(aliens.some(a=>a.y>ship.y-32))loseLife();if(!aliens.length&&playing){wave++;makeWave();enemyShots=[];sync()}}draw();requestAnimationFrame(tick)}
play.addEventListener('click',reset);window.addEventListener('keydown',e=>{const k=e.key===' '? 'Space':e.key;keys[k]=true;if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});window.addEventListener('keyup',e=>{const k=e.key===' '?'Space':e.key;keys[k]=false});document.getElementById('left').addEventListener('pointerdown',()=>keys.ArrowLeft=true);document.getElementById('left').addEventListener('pointerup',()=>keys.ArrowLeft=false);document.getElementById('left').addEventListener('pointerleave',()=>keys.ArrowLeft=false);document.getElementById('right').addEventListener('pointerdown',()=>keys.ArrowRight=true);document.getElementById('right').addEventListener('pointerup',()=>keys.ArrowRight=false);document.getElementById('right').addEventListener('pointerleave',()=>keys.ArrowRight=false);document.getElementById('fire').addEventListener('pointerdown',fire);c.addEventListener('pointerdown',e=>{if(playing){ship.x=e.clientX;fire()}});window.addEventListener('resize',resize);resize();tick()})();
</script></body></html>
