<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#70c9ed"><title>Flappy Flight — Games</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#73c9e9;font-family:system-ui,sans-serif;touch-action:none}canvas{display:block;width:100%;height:100%;touch-action:none}.hud{position:fixed;top:14px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}.pill{padding:9px 16px;border-radius:13px;background:#17334cbb;color:#fff;font-size:13px;font-weight:850;border:1px solid #ffffff55}.pill span{color:#ffe58a;margin-left:6px}.overlay{position:fixed;inset:0;display:grid;place-items:center;background:#12334a55;padding:20px}.panel{width:min(340px,100%);padding:27px;border-radius:22px;background:linear-gradient(145deg,#fff,#dff5ff);text-align:center;color:#17334c;box-shadow:0 20px 70px #17415a55}.panel h1{margin:0 0 8px;font-size:29px}.panel p{font-size:14px;line-height:1.6;color:#42627a}.panel button{border:0;border-radius:13px;padding:13px 24px;background:linear-gradient(120deg,#ffdb67,#ffad4e);color:#392d1d;font-weight:900;font-size:14px}.hint{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:#fff;text-shadow:0 2px 5px #254a60;font-size:12px}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">BEST <span id="best">0</span></div></div><div class="hint">Tap / click / press Space to flap</div><div class="overlay" id="overlay"><div class="panel"><h1 id="title">FLAPPY FLIGHT</h1><p id="copy">Tap to flap through the gates. Avoid the pipes and keep flying for the highest score.</p><button id="play">Start flying</button></div></div>
<script>
(()=>{'use strict';const c=document.getElementById('c'),ctx=c.getContext('2d'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),overlay=document.getElementById('overlay'),title=document.getElementById('title'),copy=document.getElementById('copy'),play=document.getElementById('play');let w,h,dpr,bird,pipes,score,best,playing=false,started=false,frame=0,speed=2.7,gravity=.42,flap=-7.2,ground=0;
try{best=+(localStorage.getItem('games-flappy-best')||0)}catch{}bestEl.textContent=best;
function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ground=h-48;draw()}
function reset(){bird={x:w*.28,y:h*.43,vy:0,r:15,rot:0};pipes=[];score=0;frame=0;speed=2.7;for(let i=0;i<4;i++)addPipe(w+180+i*Math.max(180,w*.55));scoreEl.textContent=0;playing=true;started=false;bird.y=h*.43;bird.vy=0;overlay.style.display='none';document.querySelector('.hint').textContent='Tap once to start · Tap repeatedly / press Space to flap'}
function addPipe(x){const gap=Math.max(142,Math.min(190,h*.27));const top=90+Math.random()*Math.max(50,ground-gap-180);pipes.push({x,top,gap,passed:false})}
function flapBird(){if(!playing)return;if(!started){started=true;document.querySelector('.hint').textContent='Tap repeatedly / press Space to flap through the pipes'}bird.vy=flap;bird.rot=-.35}
function die(){if(!playing)return;playing=false;title.textContent='Flight over!';copy.textContent='You passed '+score+' gates. Best score: '+best+'. Ready for another flight?';play.textContent='Try again';document.querySelector('.hint').textContent='Tap Try again, then tap to start flying';overlay.style.display='grid'}
function circle(x,y,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill()}
function draw(){if(!w||!h)return;ctx.clearRect(0,0,w,h);const sky=ctx.createLinearGradient(0,0,0,h);sky.addColorStop(0,'#66c4e8');sky.addColorStop(1,'#c5edee');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h);for(let i=0;i<5;i++){const x=((i*190-frame*.25)%(w+160)+w+160)%(w+160)-80,y=90+(i%3)*75;ctx.fillStyle='#ffffff88';circle(x,y,22,'#ffffff88');circle(x+23,y-7,29,'#ffffff88');circle(x+48,y,20,'#ffffff88')}pipes?.forEach(p=>{const pw=62,cap=10;ctx.fillStyle='#2caa67';ctx.fillRect(p.x,0,pw,p.top);ctx.fillRect(p.x-cap,p.top-18,pw+cap*2,18);ctx.fillRect(p.x,p.top+p.gap,pw,ground-p.top-p.gap);ctx.fillRect(p.x-cap,p.top+p.gap,pw+cap*2,18);const gr=ctx.createLinearGradient(p.x,0,p.x+pw,0);gr.addColorStop(0,'#16804d');gr.addColorStop(.45,'#63d78c');gr.addColorStop(1,'#187c4c');ctx.fillStyle=gr;ctx.fillRect(p.x+8,0,pw-16,p.top-18);ctx.fillRect(p.x+8,p.top+p.gap+18,pw-16,ground-p.top-p.gap-18)});ctx.fillStyle='#e8c76a';ctx.fillRect(0,ground,w,48);ctx.fillStyle='#7ecb62';ctx.fillRect(0,ground,w,9);for(let x=-(frame*1.7%32);x<w;x+=32){ctx.fillStyle='#d4aa50';ctx.fillRect(x,ground+14,16,5)}if(bird){ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(bird.rot);circle(0,0,bird.r,'#ffd24d');circle(6,-5,4,'#fff');circle(7,-5,2,'#243448');ctx.fillStyle='#ff8c48';ctx.beginPath();ctx.moveTo(12,2);ctx.lineTo(26,7);ctx.lineTo(12,11);ctx.closePath();ctx.fill();ctx.fillStyle='#f3a92f';ctx.beginPath();ctx.ellipse(-5,4,9,5,Math.sin(frame*.25)*.35,0,Math.PI*2);ctx.fill();ctx.restore()} }
function update(){if(playing&&started){frame++;bird.vy+=gravity;bird.y+=bird.vy;bird.rot=Math.min(.9,bird.vy*.08);pipes.forEach(p=>{p.x-=speed;if(!p.passed&&p.x+62<bird.x){p.passed=true;score++;scoreEl.textContent=score;if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('games-flappy-best',best)}catch{}}if(score%5===0)speed+=.18}});if(pipes.length&&pipes[0].x<-80){pipes.shift();addPipe(pipes.at(-1).x+Math.max(180,w*.55))}if(bird.y+bird.r>ground||bird.y-bird.r<0)die();for(const p of pipes){const within=bird.x+bird.r>p.x&&bird.x-bird.r<p.x+62;if(within&&(bird.y-bird.r<p.top||bird.y+bird.r>p.top+p.gap))die()}}draw();requestAnimationFrame(update)}
function act(){if(!playing){if(overlay.style.display!=='none')reset();return}flapBird()}
play.addEventListener('click',reset);c.addEventListener('pointerdown',e=>{e.preventDefault();act()});window.addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();act()}});window.addEventListener('resize',resize);resize();update()})();
</script></body></html>
