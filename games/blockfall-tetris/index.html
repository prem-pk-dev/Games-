<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10142b"><title>Blockfall — Games</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0b1022;color:#f5f7ff;font-family:system-ui,sans-serif;touch-action:manipulation}body{display:grid;place-items:center;padding:14px}.game{width:min(100%,760px)}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 0 12px}h1{font-size:22px;margin:0;letter-spacing:-.7px}.stats{display:flex;gap:7px;flex-wrap:wrap}.stat{background:#19213d;border:1px solid #ffffff20;border-radius:10px;padding:7px 10px;font-size:11px;color:#b9c6e8}.stat b{color:#fff;font-size:14px;margin-left:5px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:12px;align-items:start}.board-wrap{position:relative;background:#111a32;border:1px solid #ffffff20;border-radius:16px;padding:10px;display:flex;justify-content:center}canvas{display:block;max-height:72vh;width:auto;height:min(72vh,600px);max-width:100%;border-radius:8px;background:#090f20}.side{display:grid;gap:10px}.box{background:#151e38;border:1px solid #ffffff20;border-radius:13px;padding:11px}.box h2{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#aab9dd;margin:0 0 8px}.preview{width:100%;height:95px;display:block}.side button,.controls button{border:1px solid #ffffff25;background:#202c4c;color:#fff;border-radius:10px;padding:10px;font-weight:750;cursor:pointer}.side button{width:100%;margin-top:6px}.side button.primary{background:#8068f4;border-color:#a392ff}.help{color:#9eadd1;font-size:11px;line-height:1.55;margin:10px 2px}.controls{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.controls button{font-size:18px;padding:12px 2px;touch-action:none}.controls button:active,.side button:active{transform:translateY(1px);background:#6552bd}.overlay{position:absolute;inset:10px;display:grid;place-items:center;background:#070c1dd9;border-radius:9px;padding:18px;text-align:center}.overlay[hidden]{display:none}.modal{max-width:280px}.modal h2{font-size:26px;margin:0 0 8px}.modal p{font-size:13px;color:#b9c6e8;line-height:1.55}.modal button{border:0;border-radius:11px;padding:12px 22px;background:#8a75ff;color:#fff;font-weight:850;font-size:14px}@media(max-width:560px){body{padding:8px}.layout{grid-template-columns:minmax(0,1fr) 94px;gap:7px}.box{padding:7px}.preview{height:70px}.side button{font-size:10px;padding:8px 3px}.stat{padding:6px 7px}.stat b{font-size:12px}canvas{height:min(65vh,560px)}.controls button{padding:11px 0}.help{font-size:10px}}
</style></head><body><main class="game"><header><h1>BLOCKFALL</h1><div class="stats"><div class="stat">SCORE<b id="score">0</b></div><div class="stat">LINES<b id="lines">0</b></div><div class="stat">LEVEL<b id="level">1</b></div></div></header><section class="layout"><div class="board-wrap"><canvas id="board" width="300" height="600" aria-label="Tetris playfield"></canvas><div class="overlay" id="overlay"><div class="modal"><h2 id="modal-title">Blockfall</h2><p id="modal-copy">Fit falling tetrominoes together. Complete horizontal lines to score and keep the stack below the top.</p><button id="modal-action">Start game</button></div></div></div><aside class="side"><div class="box"><h2>Next</h2><canvas class="preview" id="next" width="130" height="95"></canvas></div><div class="box"><h2>Hold</h2><canvas class="preview" id="hold" width="130" height="95"></canvas><button id="hold-btn">Hold piece · C</button></div><div class="box"><button class="primary" id="pause">Pause</button><button id="restart">Restart</button></div><p class="help">← → Move<br>↑ / X Rotate<br>↓ Soft drop<br>Space Hard drop<br>P Pause · C Hold</p></aside></section><nav class="controls" aria-label="Touch controls"><button data-act="left">←</button><button data-act="rotate">↻</button><button data-act="down">↓</button><button data-act="drop">⤓</button><button data-act="right">→</button></nav></main>
<script>
(()=>{'use strict';const COLS=10,ROWS=20,S=30,board=document.getElementById('board'),ctx=board.getContext('2d'),nextCanvas=document.getElementById('next'),nctx=nextCanvas.getContext('2d'),holdCanvas=document.getElementById('hold'),hctx=holdCanvas.getContext('2d'),overlay=document.getElementById('overlay'),title=document.getElementById('modal-title'),copy=document.getElementById('modal-copy'),action=document.getElementById('modal-action');const colors={I:'#49dce8',O:'#f5d45e',T:'#b48aff',S:'#72e29b',Z:'#ff7189',J:'#6b9dff',L:'#ffae66'};const shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};let grid,bag=[],piece,next,held=null,canHold=true,score=0,lines=0,level=1,dropCounter=0,last=0,raf=0,running=false,paused=false,over=false,soft=false,keys={};function shuffled(){const a=Object.keys(shapes);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function take(){if(!bag.length)bag=shuffled();return bag.pop()}function make(type){const m=shapes[type].map(r=>r.slice());return{type,m,x:Math.floor((COLS-m[0].length)/2),y:0}}function collide(p,dx=0,dy=0,m=p.m){for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]){const nx=p.x+x+dx,ny=p.y+y+dy;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&grid[ny][nx]))return true}return false}function rotate(){if(!running||paused||over)return;const m=piece.m[0].map((_,i)=>piece.m.map(r=>r[i]).reverse());for(const kick of [0,-1,1,-2,2])if(!collide(piece,kick,0,m)){piece.x+=kick;piece.m=m;draw();return}}function move(dx){if(!running||paused||over)return;if(!collide(piece,dx,0))piece.x+=dx;draw()}function dropOne(){if(!collide(piece,0,1))piece.y++;else lock();draw()}function hardDrop(){if(!running||paused||over)return;let n=0;while(!collide(piece,0,1)){piece.y++;n++}score+=n*2;lock();draw()}function holdPiece(){if(!running||paused||over||!canHold)return;const t=piece.type;if(held){piece=make(held);held=t}else{held=t;spawn()}canHold=false;draw()}function spawn(){piece=make(next||take());next=take();canHold=true;if(collide(piece)){end()}drawPreviews()}function lock(){piece.m.forEach((r,y)=>r.forEach((v,x)=>{if(v&&piece.y+y>=0)grid[piece.y+y][piece.x+x]=piece.type}));let cleared=0;for(let y=ROWS-1;y>=0;y--)if(grid[y].every(Boolean)){grid.splice(y,1);grid.unshift(Array(COLS).fill(0));cleared++;y++}if(cleared){lines+=cleared;score+=[0,100,300,500,800][cleared]*level;level=1+Math.floor(lines/10);sync()}spawn()}function sync(){document.getElementById('score').textContent=score;document.getElementById('lines').textContent=lines;document.getElementById('level').textContent=level}function end(){running=false;over=true;title.textContent='Game over';copy.textContent='Final score: '+score+' · Lines cleared: '+lines+'. Stack again and beat your record.';action.textContent='Play again';overlay.hidden=false}function start(){if(raf)cancelAnimationFrame(raf);grid=Array.from({length:ROWS},()=>Array(COLS).fill(0));bag=[];next=take();held=null;score=0;lines=0;level=1;dropCounter=0;last=0;running=true;paused=false;over=false;sync();spawn();overlay.hidden=true;document.getElementById('pause').textContent='Pause';raf=requestAnimationFrame(loop)}function togglePause(){if(!running||over)return;paused=!paused;document.getElementById('pause').textContent=paused?'Resume':'Pause';title.textContent='Paused';copy.textContent='Take a breather. Your stack is waiting.';action.textContent='Resume';overlay.hidden=!paused}function drawCell(c,x,y,type,alpha=1){if(!type)return;c.save();c.globalAlpha=alpha;const color=colors[type];c.fillStyle=color;c.fillRect(x*S+1,y*S+1,S-2,S-2);c.fillStyle='#ffffff35';c.fillRect(x*S+3,y*S+3,S-6,4);c.strokeStyle='#07101d88';c.lineWidth=1;c.strokeRect(x*S+1.5,y*S+1.5,S-3,S-3);c.restore()}function draw(){ctx.clearRect(0,0,board.width,board.height);ctx.fillStyle='#080e1e';ctx.fillRect(0,0,board.width,board.height);ctx.strokeStyle='#ffffff0b';ctx.lineWidth=1;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*S,0);ctx.lineTo(x*S,ROWS*S);ctx.stroke()}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*S);ctx.lineTo(COLS*S,y*S);ctx.stroke()}grid.forEach((r,y)=>r.forEach((v,x)=>v&&drawCell(ctx,x,y,v)));if(piece){let ghost={...piece,y:piece.y};while(!collide(ghost,0,1))ghost.y++;ghost.m.forEach((r,y)=>r.forEach((v,x)=>v&&drawCell(ctx,ghost.x+x,ghost.y+y,ghost.type,.2)));piece.m.forEach((r,y)=>r.forEach((v,x)=>v&&drawCell(ctx,piece.x+x,piece.y+y,piece.type)))}}function preview(c,p){c.clearRect(0,0,130,95);c.fillStyle='#0d152b';c.fillRect(0,0,130,95);if(!p)return;const m=shapes[p],unit=20,ox=(130-m[0].length*unit)/2,oy=(95-m.length*unit)/2;m.forEach((r,y)=>r.forEach((v,x)=>{if(v){c.fillStyle=colors[p];c.fillRect(ox+x*unit+1,oy+y*unit+1,unit-2,unit-2);c.fillStyle='#ffffff35';c.fillRect(ox+x*unit+3,oy+y*unit+3,unit-6,3)}}))}function drawPreviews(){preview(nctx,next);preview(hctx,held)}function loop(t){if(!running||paused){draw();return}const dt=Math.min(50,t-(last||t));last=t;dropCounter+=dt;const interval=Math.max(85,850-(level-1)*65);if(dropCounter>(soft?45:interval)){dropOne();dropCounter=0}draw();raf=requestAnimationFrame(loop)}function act(a){if(a==='left')move(-1);if(a==='right')move(1);if(a==='down'){if(!collide(piece,0,1)){piece.y++;score++;sync()}else lock();draw()}if(a==='rotate')rotate();if(a==='drop')hardDrop()}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowDown','ArrowUp',' ','x','X','c','C','p','P'].includes(e.key))e.preventDefault();if(e.repeat&&['ArrowUp',' ','x','X','c','C','p','P'].includes(e.key))return;if(e.key==='ArrowLeft')act('left');if(e.key==='ArrowRight')act('right');if(e.key==='ArrowDown')soft=true;if(e.key==='ArrowUp'||e.key==='x'||e.key==='X')act('rotate');if(e.code==='Space')act('drop');if(e.key==='c'||e.key==='C')holdPiece();if(e.key==='p'||e.key==='P')togglePause()});window.addEventListener('keyup',e=>{if(e.key==='ArrowDown')soft=false});document.querySelectorAll('[data-act]').forEach(b=>{const a=b.dataset.act;b.addEventListener('pointerdown',e=>{e.preventDefault();if(a==='down'){soft=true;act('down')}else act(a)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>{if(a==='down')soft=false}))});document.getElementById('hold-btn').addEventListener('click',holdPiece);document.getElementById('pause').addEventListener('click',togglePause);document.getElementById('restart').addEventListener('click',start);action.addEventListener('click',()=>{if(paused){paused=false;overlay.hidden=true;document.getElementById('pause').textContent='Pause';last=0;raf=requestAnimationFrame(loop)}else start()});start()})();
</script></body></html>
